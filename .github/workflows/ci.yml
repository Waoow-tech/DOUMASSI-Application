name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Annule les runs précédents si une nouvelle PR/push arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version lue depuis package.json > packageManager (pnpm@10.33.2)
        # — single source of truth, évite ERR_PNPM_BAD_PM_VERSION

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

  # Tests unitaires jest (40 tests : messagerie realtime + wallet).
  # Activé une fois des tests existants (cf. cadrage docs/rpc-testing-scope.md).
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version lue depuis package.json > packageManager (comme le job quality).

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests (jest)
        run: pnpm test
